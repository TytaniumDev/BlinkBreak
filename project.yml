# BlinkBreak Xcode project spec for xcodegen.
#
# Generate the .xcodeproj with:
#   xcodegen generate
#
# This file is the source of truth for the Xcode project structure — the
# generated BlinkBreak.xcodeproj is gitignored. Diff against this file to see
# what changed in the project configuration.

name: BlinkBreak
options:
  bundleIdPrefix: com.tytaniumdev
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Swift 6 language mode: data races are compile errors.
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "F2HXQGU2CC"
    CODE_SIGN_STYLE: Automatic

# Package dependencies.
#   - BlinkBreakCore: local package, all business logic
#   - Sentry: crash / error reporting for Release builds. Pinned to an exact
#     version because the generated project's Package.resolved isn't committed;
#     bump it deliberately.
packages:
  BlinkBreakCore:
    path: Packages/BlinkBreakCore
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: "8.58.4"

targets:

  # =========================================================================
  # iOS app target
  # =========================================================================
  BlinkBreak:
    type: application
    platform: iOS
    sources:
      - path: BlinkBreak
    dependencies:
      - package: BlinkBreakCore
      - package: Sentry
        product: Sentry
    info:
      path: BlinkBreak/Info.plist
      properties:
        CFBundleDisplayName: BlinkBreak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Export compliance: BlinkBreak does not implement or call any encryption
        # directly (no network, no keychain, no custom crypto), so it's exempt from
        # U.S. export compliance. Setting this flag skips App Store Connect's
        # encryption documentation dialog on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIRequiredDeviceCapabilities:
          - arm64
        # Every screen uses AdaptiveScreen, so the app works at any size and
        # orientation: iPhone portrait + landscape, and fully resizable on iPad
        # (Split View, Slide Over, Stage Manager) and on Mac ("Designed for iPad").
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # AlarmKit user-permission prompt copy. Shown the first time we call
        # AlarmManager.shared.requestAuthorization().
        NSAlarmKitUsageDescription: "BlinkBreak schedules alarms to remind you to take 20-second eye-rest breaks every 20 minutes."
    entitlements:
      path: BlinkBreak/BlinkBreak.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tytaniumdev.BlinkBreak
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        # Runs on Apple silicon Macs as the iPad app ("Designed for iPad").
        # AlarmKit is available there; visionOS has no AlarmKit, so opt out.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - BlinkBreakTests
      gatherCoverageData: true

  # =========================================================================
  # Unit test target (runs BlinkBreakCore tests via the iOS scheme; the
  # package-level `swift test` run covers these too, this is for Xcode / CI
  # running xcodebuild test).
  # =========================================================================
  BlinkBreakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlinkBreakTests
    dependencies:
      - target: BlinkBreak
      - package: BlinkBreakCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tytaniumdev.BlinkBreakTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BlinkBreak.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BlinkBreak"
        GENERATE_INFOPLIST_FILE: YES

  # =========================================================================
  # UI test target — XCUITest integration suite.
  #
  # IMPORTANT: This suite is slow (several minutes). Only run it as a final
  # verification step, NOT during iteration. Use ./scripts/test.sh for the
  # fast unit-test loop during development.
  # =========================================================================
  BlinkBreakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BlinkBreakUITests
    dependencies:
      - target: BlinkBreak
      - package: BlinkBreakCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tytaniumdev.BlinkBreakUITests
        TEST_TARGET_NAME: BlinkBreak
        GENERATE_INFOPLIST_FILE: YES
        # XCUITest's element APIs are main-actor isolated; the suite stays in the
        # Swift 5 language mode until it's migrated to @MainActor test methods.
        SWIFT_VERSION: "5.0"

schemes:
  BlinkBreak:
    build:
      targets:
        BlinkBreak: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlinkBreakTests
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Separate scheme for the slow XCUITest integration suite. Kept out of the
  # main BlinkBreak scheme so `./scripts/test.sh` (and the fast CI unit job)
  # never accidentally runs the integration suite.
  #
  # Run via ./scripts/test-integration.sh as a final verification step.
  BlinkBreakUITests:
    build:
      targets:
        BlinkBreak: all
        BlinkBreakUITests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlinkBreakUITests
      gatherCoverageData: false
      # The app under test gets its environment from XCUIApplication.launchEnvironment
      # (see BlinkBreakUITestsBase.swift); these apply to the test runner.
      environmentVariables:
        BB_UI_TESTING: "1"
        BB_BREAK_INTERVAL: "3"
        BB_LOOKAWAY_DURATION: "3"
