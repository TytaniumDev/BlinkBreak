name: Automerge Label

# Adding the `automerge` label turns on GitHub's native auto-merge for the PR;
# removing it turns auto-merge off. GitHub itself then waits for the required
# status checks (CI / Lint, CI / Build, CI / Test) on the `main` ruleset before
# squash-merging, so this workflow never merges anything directly.
#
# Requires "Allow auto-merge" in the repo's General settings and a
# "Require status checks to pass" rule on `main`; without required checks,
# GitHub merges as soon as auto-merge is enabled.

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Enable auto-merge
        if: github.event.action == 'labeled'
        run: gh pr merge --auto --squash "$PR_URL"
      - name: Disable auto-merge
        if: github.event.action == 'unlabeled'
        run: gh pr merge --disable-auto "$PR_URL"
